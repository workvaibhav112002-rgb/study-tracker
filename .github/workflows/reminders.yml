name: reminders

# Hourly nudge: the API decides who is due based on each user's timezone and
# reminder hour. Needs the CRON_SECRET repository secret to match the Render
# env var of the same name; does nothing until both are set.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger reminders
        env:
          API_URL: ${{ vars.API_URL || 'https://study-tracker-s2ck.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 60 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/api/cron/reminders"
